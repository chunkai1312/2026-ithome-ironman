receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

exporters:
  debug/traces:
    verbosity: detailed
  debug/metrics:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug/traces]
    metrics:
      receivers: [otlp]
      exporters: [debug/metrics]
